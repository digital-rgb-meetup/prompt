<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="OUTBOUND — interactive blue-toned travel site, Asia to Europe.">
<title>OUTBOUND — Asia to Europe, one move at a time</title>
<style>*{margin:0;padding:0}img{max-width:100%}</style>
</head>
<body>
<style>
  :root{
    --navy:#0A1A3F; --azure:#2E7BE4; --sky:#4A9EFF; --cyan:#38D0E8;
    --cloud:#EAF2FF; --coral:#FF6B4A;
    /* themed tokens */
    --ink:#0A2A5E; --muted:#4E6E9E; --hud-bg:rgba(255,255,255,.5);
    --hud-line:rgba(10,42,94,.16); --hud-strong:rgba(10,42,94,.34);
    --landmark:hsl(216 46% 34%); --etch:rgba(255,255,255,.22);
    --sky-1:#5C9BEE; --sky-2:#CFE6FF; --glow:rgba(255,150,90,.30);
    --panel-blur:blur(8px);
    --f-display:'Futura','Century Gothic','Avenir Next','Helvetica Neue',system-ui,sans-serif;
    --f-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
    --f-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ink:#EAF2FF; --muted:#7E9BC9; --hud-bg:rgba(9,20,48,.44);
      --hud-line:rgba(234,242,255,.16); --hud-strong:rgba(234,242,255,.4);
      --landmark:hsl(210 70% 72%); --etch:rgba(9,20,48,.30);
      --glow:rgba(90,150,255,.28);
    }
  }
  :root[data-theme="light"]{
    --ink:#0A2A5E; --muted:#4E6E9E; --hud-bg:rgba(255,255,255,.5);
    --hud-line:rgba(10,42,94,.16); --hud-strong:rgba(10,42,94,.34);
    --landmark:hsl(216 46% 34%); --etch:rgba(255,255,255,.22); --glow:rgba(255,150,90,.30);
  }
  :root[data-theme="dark"]{
    --ink:#EAF2FF; --muted:#7E9BC9; --hud-bg:rgba(9,20,48,.44);
    --hud-line:rgba(234,242,255,.16); --hud-strong:rgba(234,242,255,.4);
    --landmark:hsl(210 70% 72%); --etch:rgba(9,20,48,.30); --glow:rgba(90,150,255,.28);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--sky-2); color:var(--ink);
    font-family:var(--f-sans); -webkit-font-smoothing:antialiased;
    cursor:none; user-select:none;
    transition:background 1s ease;
  }
  @media (pointer:coarse){ body{cursor:auto} }
  ::selection{background:var(--coral); color:#fff}

  /* ---- sky ---- */
  #sky{position:fixed; inset:0; z-index:0; background:linear-gradient(180deg,var(--sky-1),var(--sky-2)); transition:background 1.1s cubic-bezier(.4,0,.2,1)}
  #horizon{position:fixed; inset:auto 0 0 0; height:52vh; z-index:1; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 118%, var(--glow), transparent 62%); transition:background 1.1s}
  #vignette{position:fixed; inset:0; z-index:6; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 40%, transparent 58%, rgba(4,12,34,.34))}
  canvas#air{position:fixed; inset:0; z-index:2; pointer-events:none}

  /* ---- stage: landmark + name ---- */
  #stage{position:fixed; inset:0; z-index:3; display:grid; place-items:center; pointer-events:none}
  #landmarks{position:absolute; left:50%; bottom:8vh; width:min(46vh,420px); aspect-ratio:4/3;
    transform:translate(calc(-50% + var(--px,0)*-16px), calc(var(--py,0)*-9px)); color:var(--landmark)}
  .lm{position:absolute; inset:0; opacity:0; transform:translateY(14px) scale(.985);
    transition:opacity .55s ease, transform .7s cubic-bezier(.2,.7,.2,1);
    filter:drop-shadow(0 12px 30px rgba(6,16,44,.28))}
  .lm.active{opacity:.96; transform:none}
  :root[data-theme="dark"] .lm.active{filter:drop-shadow(0 0 26px hsla(210,90%,65%,.55))}
  @media (prefers-color-scheme:dark){ .lm.active{filter:drop-shadow(0 0 26px hsla(210,90%,65%,.55))} }
  .lm svg{width:100%; height:100%; display:block}

  #nameWrap{position:relative; z-index:4; text-align:center; transform:translate(calc(var(--px,0)*-28px), calc(var(--py,0)*-13px)); margin-bottom:6vh}
  #eyebrow{font-family:var(--f-mono); font-size:clamp(.6rem,1.5vw,.78rem); letter-spacing:.42em; text-transform:uppercase; color:var(--muted); margin-bottom:.9rem}
  #city{font-family:var(--f-display); font-weight:700; font-size:clamp(3.4rem,15vw,13rem); line-height:.82;
    letter-spacing:-.02em; margin:0; color:var(--ink); text-transform:uppercase; text-wrap:balance;
    text-shadow:0 6px 40px rgba(6,16,44,.18)}
  #tagline{font-family:var(--f-display); font-weight:400; font-size:clamp(1rem,3.2vw,1.7rem); color:var(--ink);
    opacity:.82; margin:1.1rem auto 0; max-width:22ch; text-wrap:balance; font-style:italic}

  /* ---- HUD ---- */
  .hud{position:fixed; z-index:7; font-family:var(--f-mono)}
  #topL{top:0; left:0; padding:clamp(1rem,2.6vw,1.8rem)}
  #brand{display:flex; align-items:center; gap:.6rem; font-family:var(--f-display); font-weight:700; letter-spacing:.24em; font-size:1.05rem}
  #brand .plane{color:var(--coral); font-size:1.15rem; transform:rotate(-8deg)}
  #topL .rt{font-size:.66rem; letter-spacing:.3em; color:var(--muted); margin-top:.35rem; text-transform:uppercase}
  #topR{top:0; right:0; padding:clamp(1rem,2.6vw,1.8rem); text-align:right}
  #clock{font-size:1.05rem; letter-spacing:.1em; font-variant-numeric:tabular-nums; color:var(--ink)}
  #topR .lbl{font-size:.6rem; letter-spacing:.3em; color:var(--muted); text-transform:uppercase; margin-bottom:.3rem}
  #themeBtn{margin-top:.7rem; font-family:var(--f-mono); font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
    background:var(--hud-bg); backdrop-filter:var(--panel-blur); color:var(--ink); border:1px solid var(--hud-line);
    padding:.45rem .7rem; border-radius:100px; cursor:pointer; transition:.25s; pointer-events:auto}
  #themeBtn:hover{border-color:var(--hud-strong)}

  /* boarding pass */
  #pass{left:50%; bottom:clamp(4.5rem,10vh,6.5rem); transform:translateX(-50%);
    display:grid; grid-template-columns:auto 1fr auto; gap:clamp(1rem,4vw,3rem); align-items:center;
    width:min(880px,92vw); padding:.9rem 1.3rem; background:var(--hud-bg); backdrop-filter:var(--panel-blur);
    border:1px solid var(--hud-line); border-radius:14px}
  #pass .port{text-align:center}
  #pass .code{font-family:var(--f-display); font-weight:700; font-size:clamp(1.3rem,4vw,2rem); letter-spacing:.04em; color:var(--ink)}
  #pass .sub{font-size:.6rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-top:.2rem}
  #pass .mid{display:flex; flex-direction:column; gap:.3rem; min-width:0}
  #pass .path{display:flex; align-items:center; gap:.5rem; color:var(--hud-strong)}
  #pass .path .line{flex:1; height:0; border-top:1.5px dashed var(--hud-strong); position:relative}
  #pass .path .pin{color:var(--coral); font-size:.95rem}
  #pass .facts{display:flex; justify-content:space-between; gap:.6rem; font-size:.62rem; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; flex-wrap:wrap}
  #pass .facts b{color:var(--ink); font-weight:400; font-variant-numeric:tabular-nums}

  /* route ribbon */
  #route{left:50%; bottom:1.4rem; transform:translateX(-50%); display:flex; align-items:center; gap:0;
    width:min(880px,92vw); pointer-events:auto}
  #route .end{font-size:.58rem; letter-spacing:.28em; color:var(--muted); text-transform:uppercase; white-space:nowrap}
  #route .dots{flex:1; display:flex; align-items:center; justify-content:space-between; margin:0 .9rem; position:relative}
  #route .dots::before{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--hud-line)}
  #route .stop{position:relative; display:grid; place-items:center; cursor:pointer; padding:.5rem .1rem; background:none; border:0}
  #route .stop i{width:7px; height:7px; border-radius:50%; background:var(--hud-strong); transition:.3s; display:block}
  #route .stop.on i{background:var(--coral); box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 26%,transparent); transform:scale(1.35)}
  #route .stop b{position:absolute; bottom:120%; font-family:var(--f-mono); font-size:.54rem; letter-spacing:.1em; color:var(--muted); opacity:0; transition:.3s; white-space:nowrap; font-weight:400}
  #route .stop.on b, #route .stop:hover b{opacity:1; color:var(--ink)}

  /* nav chevrons (touch/keyboard) */
  .chev{position:fixed; top:50%; transform:translateY(-50%); z-index:7; width:44px; height:44px; border-radius:50%;
    background:var(--hud-bg); backdrop-filter:var(--panel-blur); border:1px solid var(--hud-line); color:var(--ink);
    display:none; place-items:center; cursor:pointer; font-size:1.1rem; pointer-events:auto}
  #prev{left:1rem} #next{right:1rem}
  @media (pointer:coarse){ .chev{display:grid} }

  /* hint */
  #hint{position:fixed; z-index:7; left:50%; top:calc(50% + clamp(9rem,22vh,14rem)); transform:translateX(-50%);
    font-family:var(--f-mono); font-size:.66rem; letter-spacing:.24em; text-transform:uppercase; color:var(--muted);
    display:flex; gap:.6rem; align-items:center; transition:opacity .6s; text-align:center}
  #hint.gone{opacity:0}
  #hint .k{border:1px solid var(--hud-line); border-radius:5px; padding:.15rem .4rem; color:var(--ink)}

  /* custom cursor */
  #cursor{position:fixed; z-index:8; top:0; left:0; width:40px; height:40px; margin:-20px 0 0 -20px; pointer-events:none;
    color:var(--coral); transition:opacity .3s, transform .12s ease-out}
  #cursor svg{width:100%; height:100%; display:block}
  #cursor .co{position:absolute; top:105%; left:50%; transform:translateX(-50%); font-family:var(--f-mono);
    font-size:.52rem; letter-spacing:.08em; color:var(--ink); white-space:nowrap; opacity:.75}
  @media (pointer:coarse){ #cursor{display:none} }

  @media (max-width:640px){
    #pass{grid-template-columns:auto 1fr auto; gap:.7rem; padding:.7rem .8rem}
    #pass .facts{display:none}
    #hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .lm, #sky, #horizon, body{transition-duration:.2s}
  }
</style>

<div id="sky"></div>
<div id="horizon"></div>
<canvas id="air"></canvas>
<div id="vignette"></div>

<div id="stage">
  <div id="landmarks"></div>
  <div id="nameWrap">
    <div id="eyebrow">Now boarding · Gate 07</div>
    <h1 id="city">TOKYO</h1>
    <p id="tagline">Neon dusk over a thousand alleys.</p>
  </div>
</div>

<header class="hud" id="topL">
  <div id="brand"><span class="plane">✈</span> OUTBOUND</div>
  <div class="rt">Asia&nbsp;&nbsp;→&nbsp;&nbsp;Europe</div>
</header>

<header class="hud" id="topR">
  <div class="lbl">Zulu time</div>
  <div id="clock">--:--:--</div>
  <button id="themeBtn" aria-label="Toggle day / night">Night flight</button>
</header>

<button class="chev" id="prev" aria-label="Previous destination">‹</button>
<button class="chev" id="next" aria-label="Next destination">›</button>

<section class="hud" id="pass" aria-live="polite">
  <div class="port">
    <div class="code">HAN</div><div class="sub">Hanoi</div>
  </div>
  <div class="mid">
    <div class="path"><span>DEP</span><span class="line"></span><span class="pin">✈</span><span class="line"></span><span>ARR</span></div>
    <div class="facts">
      <span>Coord <b id="fCoord">35.7N 139.7E</b></span>
      <span>Local <b id="fLocal">--:--</b></span>
      <span>Dist <b id="fDist">3,700 km</b></span>
      <span>Flight <b id="fNo">OB 881</b></span>
    </div>
  </div>
  <div class="port">
    <div class="code" id="pIata">HND</div><div class="sub" id="pCountry">Japan</div>
  </div>
</section>

<nav class="hud" id="route">
  <span class="end">Asia</span>
  <div class="dots" id="dots"></div>
  <span class="end">Europe</span>
</nav>

<div id="hint"><span class="k">Move</span> to explore &nbsp;·&nbsp; <span class="k">Click</span> to fly</div>

<div id="cursor">
  <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="20" cy="20" r="10"/><path d="M20 3v6M20 31v6M3 20h6M31 20h6"/><circle cx="20" cy="20" r="1.5" fill="currentColor"/>
  </svg>
  <span class="co" id="curCo"></span>
</div>

<script>
(() => {
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  const coarse = matchMedia('(pointer:coarse)').matches;

  const DEST = [
    {city:'Tokyo',    iata:'HND', country:'Japan',      lat:35.68, lon:139.69, off:9, dist:3700, hue:226, gate:'07', no:'OB 881', lm:'tokyo',     tag:'Neon dusk over a thousand alleys.'},
    {city:'Bangkok',  iata:'BKK', country:'Thailand',   lat:13.76, lon:100.50, off:7, dist:980,  hue:198, gate:'12', no:'OB 214', lm:'bangkok',   tag:'Gold spires and river heat.'},
    {city:'Singapore',iata:'SIN', country:'Singapore',  lat:1.35,  lon:103.82, off:8, dist:2200, hue:189, gate:'03', no:'OB 355', lm:'singapore', tag:'A garden built into the sky.'},
    {city:'Dubai',    iata:'DXB', country:'UAE',        lat:25.20, lon:55.27,  off:4, dist:4900, hue:214, gate:'21', no:'OB 640', lm:'dubai',     tag:'Where the desert touches cloud.'},
    {city:'Istanbul', iata:'IST', country:'Türkiye',    lat:41.01, lon:28.98,  off:3, dist:7600, hue:205, gate:'09', no:'OB 118', lm:'istanbul',  tag:'Two continents, one skyline.'},
    {city:'Rome',     iata:'FCO', country:'Italy',      lat:41.90, lon:12.50,  off:1, dist:8700, hue:210, gate:'16', no:'OB 470', lm:'rome',      tag:'Every stone remembers an empire.'},
    {city:'Paris',    iata:'CDG', country:'France',     lat:48.86, lon:2.35,   off:1, dist:9100, hue:220, gate:'04', no:'OB 902', lm:'paris',     tag:'Iron lace against a silver sky.'},
    {city:'London',   iata:'LHR', country:'England',    lat:51.51, lon:-0.13,  off:0, dist:9300, hue:218, gate:'11', no:'OB 100', lm:'london',    tag:'Fog, chimes and river light.'},
  ];
  const N = DEST.length;

  /* ---- landmark silhouettes (minimal, iconic) ---- */
  const LM = {
    tokyo:`<rect x="118" y="16" width="4" height="22"/><path d="M92 175 Q118 92 120 42 Q122 92 148 175 Z"/><rect x="106" y="96" width="28" height="8"/><rect x="99" y="150" width="42" height="9"/>`,
    bangkok:`<path d="M116 22 L120 6 L124 22 Z"/><path d="M101 175 L109 58 Q120 40 120 40 Q120 40 131 58 L139 175 Z"/><rect x="104" y="150" width="32" height="8"/><rect x="108" y="120" width="24" height="7"/><rect x="111" y="92" width="18" height="6"/>`,
    singapore:`<rect x="42" y="52" width="156" height="14" rx="7"/><path d="M56 175 L66 68 L80 68 L74 175 Z"/><path d="M112 175 L117 68 L129 68 L126 175 Z"/><path d="M186 175 L176 68 L190 68 L192 175 Z"/>`,
    dubai:`<path d="M112 175 L117 70 L119 38 L120 12 L121 38 L123 70 L128 175 Z"/><path d="M118 92 L102 175 L112 175 Z"/><path d="M122 92 L138 175 L128 175 Z"/>`,
    istanbul:`<rect x="84" y="118" width="72" height="57"/><path d="M84 120 Q120 58 156 120 Z"/><rect x="118" y="50" width="4" height="12"/><path d="M68 132 Q84 98 100 132 Z"/><path d="M140 132 Q156 98 172 132 Z"/><rect x="48" y="70" width="8" height="105"/><path d="M48 70 Q52 54 56 70 Z"/><rect x="51" y="46" width="2" height="12"/><rect x="184" y="70" width="8" height="105"/><path d="M184 70 Q188 54 192 70 Z"/><rect x="187" y="46" width="2" height="12"/>`,
    rome:`<path d="M40 175 V128 Q40 104 120 104 Q200 104 200 128 V175 Z"/><rect x="40" y="90" width="54" height="22"/><g fill="var(--etch)"><rect x="54" y="120" width="9" height="18" rx="4"/><rect x="78" y="120" width="9" height="18" rx="4"/><rect x="102" y="120" width="9" height="18" rx="4"/><rect x="126" y="120" width="9" height="18" rx="4"/><rect x="150" y="120" width="9" height="18" rx="4"/><rect x="174" y="120" width="9" height="18" rx="4"/></g>`,
    paris:`<rect x="118" y="16" width="4" height="18"/><path d="M84 175 Q116 84 120 40 Q124 84 156 175 L133 175 Q120 128 120 102 Q120 128 107 175 Z"/><rect x="100" y="118" width="40" height="8"/><path d="M100 175 Q120 152 140 175 Z" fill="var(--etch)"/>`,
    london:`<path d="M88 58 L120 28 L152 58 Z"/><rect x="118" y="18" width="4" height="12"/><rect x="86" y="58" width="68" height="14"/><rect x="92" y="72" width="56" height="20"/><rect x="96" y="90" width="48" height="85"/><rect x="88" y="168" width="64" height="9"/><circle cx="120" cy="82" r="8" fill="var(--etch)"/>`,
  };

  const landmarksEl = document.getElementById('landmarks');
  landmarksEl.innerHTML = DEST.map((d,i)=>
    `<div class="lm" data-i="${i}"><svg viewBox="0 0 240 180" fill="currentColor">${LM[d.lm]||''}</svg></div>`).join('');
  const lmEls = [...landmarksEl.querySelectorAll('.lm')];

  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = DEST.map((d,i)=>`<button class="stop" data-i="${i}"><b>${d.iata}</b><i></i></button>`).join('');
  const stops = [...dotsEl.querySelectorAll('.stop')];

  const cityEl=document.getElementById('city'), tagEl=document.getElementById('tagline'),
        eyebrowEl=document.getElementById('eyebrow'), iataEl=document.getElementById('pIata'),
        countryEl=document.getElementById('pCountry'), fCoord=document.getElementById('fCoord'),
        fLocal=document.getElementById('fLocal'), fDist=document.getElementById('fDist'),
        fNo=document.getElementById('fNo'), skyEl=document.getElementById('sky'),
        horizonEl=document.getElementById('horizon'), curCo=document.getElementById('curCo');

  let cur = -1;

  function skyFor(hue){
    const dark = (root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark';
    if(dark) return `linear-gradient(180deg, hsl(${hue} 58% 10%), hsl(${hue+8} 48% 22%))`;
    return `linear-gradient(180deg, hsl(${hue} 72% 60%), hsl(${hue+14} 82% 90%))`;
  }
  function flip(el){
    if(reduce) return;
    el.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],
      {duration:440,easing:'cubic-bezier(.2,.7,.2,1)'});
  }

  function commit(i, animate=true){
    i=((i%N)+N)%N; if(i===cur) return;
    cur=i; const d=DEST[i];
    root.style.setProperty('--sky-1', `hsl(${d.hue} 72% 60%)`);
    root.style.setProperty('--sky-2', `hsl(${d.hue+14} 82% 90%)`);
    skyEl.style.background = skyFor(d.hue);
    document.body.style.background = getComputedStyle(root).getPropertyValue('--sky-2');
    cityEl.textContent = d.city.toUpperCase();
    tagEl.textContent = d.tag;
    eyebrowEl.textContent = `Now boarding · Gate ${d.gate}`;
    iataEl.textContent = d.iata; countryEl.textContent = d.country;
    fCoord.textContent = `${Math.abs(d.lat).toFixed(1)}${d.lat>=0?'N':'S'} ${Math.abs(d.lon).toFixed(1)}${d.lon>=0?'E':'W'}`;
    fDist.textContent = d.dist.toLocaleString('en-US')+' km';
    fNo.textContent = d.no;
    curCo.textContent = `${d.iata} · ${d.lat.toFixed(2)}, ${d.lon.toFixed(2)}`;
    lmEls.forEach((e,k)=>e.classList.toggle('active',k===i));
    stops.forEach((e,k)=>e.classList.toggle('on',k===i));
    if(animate){ flip(cityEl); flip(tagEl); }
    updateLocal();
  }

  /* ---- clocks ---- */
  const pad=n=>String(n).padStart(2,'0');
  function updateClock(){
    const now=new Date();
    document.getElementById('clock').textContent =
      `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())}Z`;
  }
  function updateLocal(){
    const d=DEST[cur]; if(!d) return;
    const now=new Date();
    const local=new Date(now.getTime()+ (d.off*60 + now.getTimezoneOffset())*60000);
    fLocal.textContent = `${pad(local.getHours())}:${pad(local.getMinutes())}`;
  }
  updateClock(); setInterval(()=>{updateClock(); if(cur>=0) updateLocal();},1000);

  /* ---- pointer → destination + parallax ---- */
  const cursor=document.getElementById('cursor');
  let hinted=false;
  function killHint(){ if(!hinted){hinted=true; document.getElementById('hint').classList.add('gone');} }
  function onMove(x,y){
    const nx=x/innerWidth, ny=y/innerHeight;
    root.style.setProperty('--px',(nx-0.5)*2);
    root.style.setProperty('--py',(ny-0.5)*2);
    commit(Math.min(N-1, Math.max(0, Math.floor(nx*N))));
    cursor.style.transform=`translate(${x}px,${y}px)`;
    cursor.style.opacity='1';
    killHint();
  }
  addEventListener('pointermove', e=>onMove(e.clientX,e.clientY), {passive:true});
  addEventListener('pointerleave', ()=>cursor.style.opacity='0');

  /* ---- paper planes on click ---- */
  const cv=document.getElementById('air'), ctx=cv.getContext('2d');
  let W,H,DPR;
  function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); buildClouds(); }
  addEventListener('resize', resize);

  const planes=[], puffs=[];
  function launch(x,y){
    const dir = -0.9 + Math.random()*0.5;          // mostly up-right
    const spd = 7.5 + Math.random()*4;
    const ang = dir;                                // radians-ish around up-right
    const vx = Math.cos(ang)*spd*1.4 + 2.5;
    const vy = Math.sin(ang)*spd - 3;
    planes.push({x,y,vx,vy,rot:Math.atan2(vy,vx),trail:[],life:0,scale:.9+Math.random()*.5});
    for(let k=0;k<8;k++){ const a=Math.random()*6.28, s=1+Math.random()*3;
      puffs.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1}); }
    if(planes.length>44) planes.splice(0,planes.length-44);
    killHint();
  }
  addEventListener('pointerdown', e=>{ launch(e.clientX,e.clientY);
    cursor.style.transform=`translate(${e.clientX}px,${e.clientY}px) scale(.8)`; });

  /* ---- ambient clouds / stars ---- */
  let clouds=[], stars=[];
  function buildClouds(){
    clouds=[]; const n=Math.round(W/260)+3;
    for(let i=0;i<n;i++) clouds.push({x:Math.random()*W, y:Math.random()*H*0.6+H*0.05,
      s:.5+Math.random()*1.1, v:.08+Math.random()*.18, o:.12+Math.random()*.16});
    stars=[]; for(let i=0;i<90;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.7,
      r:Math.random()*1.3+.2, ph:Math.random()*6.28});
  }
  function isDark(){ const t=root.getAttribute('data-theme');
    return t? t==='dark' : matchMedia('(prefers-color-scheme:dark)').matches; }

  function drawCloud(c,px){
    const x=c.x+px*22*c.s, y=c.y+ (root.style.getPropertyValue('--py')||0)*8*c.s;
    ctx.save(); ctx.globalAlpha=c.o; ctx.fillStyle= isDark()? '#dfeaff' : '#ffffff';
    const r=26*c.s;
    for(const [dx,dy,rr] of [[-r,4,r*.8],[0,0,r],[r,4,r*.85],[r*.4,-r*.5,r*.6],[-r*.5,-r*.4,r*.55]]){
      ctx.beginPath(); ctx.ellipse(x+dx,y+dy,rr,rr*.72,0,0,6.283); ctx.fill();
    }
    ctx.restore();
  }
  function drawPlane(p){
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.scale(p.scale,p.scale);
    ctx.fillStyle=getComputedStyle(root).getPropertyValue('--coral')||'#FF6B4A';
    ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-11,-8); ctx.lineTo(-5,0); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.moveTo(15,0); ctx.lineTo(-5,0); ctx.lineTo(-11,8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  let t0=0;
  function frame(t){
    const dt=Math.min(2,(t-t0)/16.67)||1; t0=t;
    ctx.clearRect(0,0,W,H);
    const px=parseFloat(root.style.getPropertyValue('--px'))||0;

    // stars (night)
    if(isDark()){
      for(const s of stars){ const tw=reduce?.7:(.4+.6*Math.abs(Math.sin(t*0.001+s.ph)));
        ctx.globalAlpha=tw*.8; ctx.fillStyle='#eaf2ff';
        ctx.beginPath(); ctx.arc(s.x+px*10,s.y,s.r,0,6.283); ctx.fill(); }
      ctx.globalAlpha=1;
    }
    // clouds
    for(const c of clouds){ if(!reduce){ c.x+=c.v*dt; if(c.x-80>W) c.x=-80; } drawCloud(c,px); }

    // route arc (faint great-circle) with travelling dot
    ctx.strokeStyle='var(--hud-line)'; ctx.globalAlpha=.5;
    ctx.setLineDash([2,7]); ctx.lineWidth=1.2; ctx.beginPath();
    const ay=H*0.2; ctx.moveTo(W*0.08,ay+30); ctx.quadraticCurveTo(W*0.5,ay-40,W*0.92,ay+30); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha=1;

    // puffs
    for(let i=puffs.length-1;i>=0;i--){ const q=puffs[i]; q.x+=q.vx; q.y+=q.vy; q.vy+=.05; q.life-=.03;
      if(q.life<=0){puffs.splice(i,1);continue;}
      ctx.globalAlpha=q.life*.5; ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(q.x,q.y,2.2*q.life+.5,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1;

    // planes
    const coral=getComputedStyle(root).getPropertyValue('--coral')||'#FF6B4A';
    for(let i=planes.length-1;i>=0;i--){ const p=planes[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; if(!reduce) p.vy+=0.055*dt; p.vx*=0.996;
      p.rot=Math.atan2(p.vy,p.vx); p.life+=dt;
      p.trail.push([p.x,p.y]); if(p.trail.length>26) p.trail.shift();
      // contrail
      ctx.strokeStyle=coral; ctx.globalAlpha=.28; ctx.lineWidth=1.5; ctx.setLineDash([1,6]); ctx.beginPath();
      p.trail.forEach((pt,k)=>k?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1])); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha=1;
      drawPlane(p);
      if(p.x>W+60||p.y>H+60||p.x<-60){ planes.splice(i,1); }
    }
    requestAnimationFrame(frame);
  }

  /* ---- controls ---- */
  document.getElementById('prev').addEventListener('click',()=>{ commit(cur-1); });
  document.getElementById('next').addEventListener('click',()=>{ commit(cur+1); });
  stops.forEach(s=>s.addEventListener('click',()=>commit(+s.dataset.i)));
  addEventListener('keydown',e=>{
    if(e.key==='ArrowRight') commit(cur+1);
    else if(e.key==='ArrowLeft') commit(cur-1);
    else if(e.key===' '){ e.preventDefault(); launch(innerWidth*(.3+Math.random()*.4), innerHeight*.6); }
  });

  /* ---- theme ---- */
  let dark = matchMedia('(prefers-color-scheme:dark)').matches;
  const themeBtn=document.getElementById('themeBtn');
  function syncTheme(){ root.setAttribute('data-theme',dark?'dark':'light');
    themeBtn.textContent = dark?'Day sky':'Night flight';
    if(cur>=0){ skyEl.style.background=skyFor(DEST[cur].hue);
      document.body.style.background=getComputedStyle(root).getPropertyValue('--sky-2'); } }
  themeBtn.addEventListener('click',()=>{dark=!dark; syncTheme();});

  /* ---- go ---- */
  resize(); syncTheme(); commit(0,false);
  if(coarse){ // touch: gentle auto-suggest handled by chevrons; still allow drag-sweep via pointermove
    document.getElementById('hint').textContent='Swipe to explore · Tap to fly';
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
